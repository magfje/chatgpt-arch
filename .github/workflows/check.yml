name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y gnupg shellcheck

      - name: Check shell scripts
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Verify current OpenAI metadata
        run: ./scripts/update-package.sh --check

      - name: Test package metadata
        run: ./tests/test-package.sh

